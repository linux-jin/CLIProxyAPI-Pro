name: Sync upstream

on:
  schedule:
    # 每6小时同步一次
    - cron: "0 */6 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Sync upstream
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git remote add upstream https://github.com/ssfun/CLIProxyAPI-Pro.git

          git fetch upstream

          git checkout main

          git merge upstream/main --allow-unrelated-histories

          git push origin main
